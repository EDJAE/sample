<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taskly — Simple Task Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="#">Taskly<span>.</span></a>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Get things done.</h1>
      <p>Add your tasks, check them off, and keep your day moving.</p>
    </section>

    <section class="app" aria-label="Task tracker">
      <form class="task-form" id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="120"
          aria-label="New task"
        >
        <button type="submit" class="btn-primary">Add</button>
      </form>

      <div class="stats" id="stats"></div>

      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="done">Done</button>
      </div>

      <ul class="task-list" id="taskList"></ul>

      <p class="empty" id="empty">Nothing here yet. Add your first task above.</p>

      <div class="app-footer">
        <span id="remaining">0 tasks left</span>
        <button class="btn-ghost" id="clearDone">Clear completed</button>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built with plain HTML, CSS &amp; JavaScript.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
